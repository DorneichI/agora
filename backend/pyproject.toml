[project]
name = "backend"
version = "0.1.0"
description = "Agora backend (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "pyjwt[crypto]>=2.13.0",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "import-linter>=2.14",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
# SQLAlchemy's async engine bridges to its sync core via greenlet, which
# coverage.py's tracer loses track of across that context switch unless told
# to follow it explicitly (https://github.com/nedbat/coveragepy/issues/1082).
# `core = "ctrace"` is required on Python 3.13 for the concurrency setting to
# take effect at all (the newer sysmon-based tracer doesn't support it yet).
concurrency = ["thread", "greenlet"]
core = "ctrace"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Leagues and gameplay are mutually independent"
type = "independence"
modules = [
    "app.leagues",
    "app.gameplay",
]

[[tool.importlinter.contracts]]
name = "Foundation modules must not depend on domain packages"
type = "forbidden"
source_modules = [
    "app.auth",
    "app.deps",
    "app.routers",
    "app.db",
    "app.crud_helpers",
    "app.soft_delete",
    "app.models",
]
forbidden_modules = [
    "app.leagues",
    "app.gameplay",
    "app.standings",
]
