name: CI

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
              - 'package.json'
              - 'lefthook.yml'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://agora:agora@localhost:5432/agora
      CLERK_ISSUER: https://test.clerk.accounts.dev
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agora
          POSTGRES_PASSWORD: agora
          POSTGRES_DB: agora
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      # `key` only ever matches on a re-run of the exact same commit; on a normal PR run it's a
      # no-op and `restore-keys`' prefix match (picking the most recently saved entry from main)
      # is what actually restores the baseline.
      - name: Restore coverage baseline
        uses: actions/cache/restore@v6
        with:
          path: backend/.coverage-baseline
          key: backend-coverage-baseline-${{ github.sha }}
          restore-keys: |
            backend-coverage-baseline-
      - name: Run tests with coverage
        # Explicit `shell: bash` (rather than relying on the runner's implicit default shell)
        # is required for `pipefail` -- without it, `tee`'s always-zero exit code is what this
        # step reports, so a failing test suite would not fail CI.
        shell: bash
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=json | tee coverage.txt
      - name: Append coverage to job summary
        if: always()
        run: |
          echo '## Backend coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Compute coverage percentage
        run: |
          pct=$(jq -r '.totals.percent_covered' coverage.json)
          case "$pct" in
            ''|*[!0-9.]*)
              echo "::error::backend coverage.json produced a non-numeric percentage: '$pct'"
              exit 1
              ;;
          esac
          echo "BACKEND_COVERAGE=$pct" >> "$GITHUB_ENV"
      - name: Check coverage ratchet
        if: github.event_name == 'pull_request'
        run: bash ../scripts/check-coverage-ratchet.sh backend "$BACKEND_COVERAGE" .coverage-baseline
      - name: Save coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "$BACKEND_COVERAGE" > .coverage-baseline
      - name: Cache coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: backend/.coverage-baseline
          key: backend-coverage-baseline-${{ github.sha }}

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      # `key` only ever matches on a re-run of the exact same commit; on a normal PR run it's a
      # no-op and `restore-keys`' prefix match (picking the most recently saved entry from main)
      # is what actually restores the baseline.
      - name: Restore coverage baseline
        uses: actions/cache/restore@v6
        with:
          path: web/.coverage-baseline
          key: web-coverage-baseline-${{ github.sha }}
          restore-keys: |
            web-coverage-baseline-
      - name: Run tests with coverage
        # See the equivalent backend step for why `shell: bash` is required here: without it,
        # `tee`'s always-zero exit code -- not the test runner's -- is what this step reports.
        shell: bash
        run: npm run test -- --coverage | tee coverage.txt
      - name: Append coverage to job summary
        if: always()
        run: |
          echo '## Web coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Compute coverage percentage
        run: |
          pct=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          case "$pct" in
            ''|*[!0-9.]*)
              echo "::error::web coverage-summary.json produced a non-numeric percentage: '$pct'"
              exit 1
              ;;
          esac
          echo "WEB_COVERAGE=$pct" >> "$GITHUB_ENV"
      - name: Check coverage ratchet
        if: github.event_name == 'pull_request'
        run: bash ../scripts/check-coverage-ratchet.sh web "$WEB_COVERAGE" .coverage-baseline
      - name: Save coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "$WEB_COVERAGE" > .coverage-baseline
      - name: Cache coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: web/.coverage-baseline
          key: web-coverage-baseline-${{ github.sha }}

  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm run test:coverage-ratchet
      - run: npm run test:sync-env
      - run: npm run test:pr-template

  # Unscoped (no `needs: changes` gate) -- a secret can land in any file, not just backend/web
  # source, so this always runs. Authoritative backstop for lefthook's local pre-commit scan
  # (which can be skipped with --no-verify, or simply not run yet if a contributor hasn't
  # installed the gitleaks binary) -- see root CLAUDE.md's "Pre-push checks" section. Still
  # skipped on a PR-body-only `edited` event, though, since a full-history secret scan can't
  # find anything new when no commit has landed.
  secrets:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Unscoped (no `needs: changes` gate) -- enforces .github/PULL_REQUEST_TEMPLATE.md's minimum
  # structure regardless of which package(s) the PR touches. See root CLAUDE.md's "PR template
  # check" subsection (under "## CI") for what this checks and why.
  pr-template:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Save PR body to a file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > pr_body.txt
      - run: bash scripts/check-pr-template.sh pr_body.txt

  ci-status:
    needs: [changes, backend, web, scripts, secrets, pr-template]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        # Assert every needed job is success-or-skipped, rather than only scanning for the
        # literal string "failure" -- that check missed `needs.changes` entirely (so a failed
        # or cancelled `changes` job left backend/web/scripts all skipped and still reported
        # green) and treated "cancelled" the same as a pass.
        run: |
          for result in "${{ needs.changes.result }}" "${{ needs.backend.result }}" "${{ needs.web.result }}" "${{ needs.scripts.result }}" "${{ needs.secrets.result }}" "${{ needs.pr-template.result }}"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::A required job did not pass (result: $result)."
                exit 1
                ;;
            esac
          done
          echo "All required jobs passed or were skipped."
