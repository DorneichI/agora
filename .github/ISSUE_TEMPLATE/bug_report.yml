name: Bug report
description: Report something that's broken or not working as expected.
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably trigger the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened (include error messages/screenshots if relevant).
    validations:
      required: true
  - type: checkboxes
    id: package
    attributes:
      label: Package(s) affected
      options:
        - label: backend
        - label: web
        - label: mobile
        - label: other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: e.g. local / staging / prod, browser, OS, device.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that might help (logs, related issues, screenshots).
    validations:
      required: false
