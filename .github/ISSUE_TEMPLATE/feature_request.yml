name: Feature request
description: Propose a new feature or enhancement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem-motivation
    attributes:
      label: Problem / motivation
      description: What problem does this solve, or what's the motivation for this feature?
    validations:
      required: true
  - type: textarea
    id: proposed-approach
    attributes:
      label: Proposed approach
      description: How would you approach building this?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: What must be true for this feature to be considered done?
    validations:
      required: true
  - type: checkboxes
    id: package
    attributes:
      label: Package(s) affected
      options:
        - label: backend
        - label: web
        - label: mobile
        - label: other
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that might help (mockups, related issues, links).
    validations:
      required: false
