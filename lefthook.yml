# `root:` changes cwd for a command but leaves the hook's inherited GIT_PREFIX/GIT_DIR
# pointing at the repo root, so any `git` call embedded in a `root:`-scoped `run:` must
# unset both first (`env -u GIT_PREFIX -u GIT_DIR`) or it silently stages files under the
# wrong (phantom, non-`root:`-relative) path.
glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    backend-format:
      root: "backend/"
      glob: "backend/**/*.py"
      run: uv run ruff format {staged_files} && env -u GIT_PREFIX -u GIT_DIR git add {staged_files} && uv run ruff check --fix {staged_files}
      stage_fixed: true
    web-lint:
      root: "web/"
      glob: "web/**/*.{js,jsx,ts,tsx}"
      run: npx eslint --fix {staged_files} && env -u GIT_PREFIX -u GIT_DIR git add {staged_files} && npx prettier --write {staged_files}
      stage_fixed: true
    # File-length enforcement for backend (see root CLAUDE.md's file-length enforcement
    # section). Web needs no equivalent command here -- ESLint's `max-lines` rule already
    # runs as part of web-lint above, since ruff (unlike ESLint) has no built-in line-count
    # rule. Only checks staged files (same scope as backend-format above), so it only ever
    # flags the file you're actively touching -- a file that crossed the limit via someone
    # else's earlier, unrelated commit won't surface here until it's next staged.
    backend-file-length:
      root: "backend/"
      glob: "backend/**/*.py"
      run: |
        files=""
        for f in {staged_files}; do
          case "$f" in
            tests/*|./tests/*) ;;
            *) files="$files $f" ;;
          esac
        done
        if [ -n "$files" ]; then bash ../scripts/check-file-length.sh 400 $files; fi
    # Repo-wide (no `root:`/`glob:` scoping — a secret can land in any file, not just
    # backend/web source). Fails loudly, blocking the commit, if the `gitleaks` binary isn't
    # on PATH — it's a standalone binary `npm install` can't provision, so missing it must be
    # a hard stop rather than a silent skip. See root CLAUDE.md's "Pre-push checks" section.
    secret-scan:
      run: |
        command -v gitleaks >/dev/null 2>&1 || { echo "gitleaks not found on PATH -- install it before committing (macOS: brew install gitleaks; other platforms: https://github.com/gitleaks/gitleaks#installing)." >&2; exit 1; }
        gitleaks protect --staged --redact --no-banner

pre-push:
  parallel: true
  commands:
    # Requires `docker compose up -d postgres` (or `... up -d backend`) running locally —
    # pytest connects to a real Postgres. The credentials below must match `.env`'s
    # POSTGRES_USER/PASSWORD/DB if those are ever changed from the shared default.
    backend-check:
      root: "backend/"
      glob: "backend/**/*"
      env:
        DATABASE_URL: "postgresql+asyncpg://agora:agora@localhost:5432/agora"
        CLERK_ISSUER: "https://test.clerk.accounts.dev"
      run: uv run ruff check . && uv run pytest
    # Full-tree scan (unlike the pre-commit staged-files version above), since pre-push is
    # the right point to catch a file that crossed the limit without ever being staged in a
    # commit that touched this hook (e.g. a merge). `git ls-files` needs GIT_PREFIX/GIT_DIR
    # unset for the same reason as `git add` above -- see this file's top comment. Web needs
    # no equivalent command here -- ESLint's `max-lines` rule already runs as part of the
    # `npm run lint` inside web-check below.
    backend-file-length:
      root: "backend/"
      glob: "backend/**/*"
      run: |
        files=$(env -u GIT_PREFIX -u GIT_DIR git ls-files -- '*.py' | grep -v '^tests/')
        bash ../scripts/check-file-length.sh 400 $files
    web-check:
      root: "web/"
      glob: "web/**/*"
      run: npm run lint && npm run typecheck && npm run test
