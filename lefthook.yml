glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    backend-format:
      root: "backend/"
      glob: "backend/**/*.py"
      run: uv run ruff format {staged_files} && uv run ruff check --fix {staged_files}
      stage_fixed: true
    web-lint:
      root: "web/"
      glob: "web/**/*.{js,jsx,ts,tsx}"
      run: npx eslint --fix {staged_files} && npx prettier --write {staged_files}
      stage_fixed: true
